<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Catálogo de Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Catálogo de Produtos</h1>
    <p class="cabecalho-subtitulo">Entre com seu e-mail e senha para acessar o sistema.</p>
  </header>

  <main class="conteudo conteudo-estreito">
    <form id="form-login" class="painel-filtros" novalidate>
      <div class="campo">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" name="email" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" name="senha" autocomplete="current-password" required>
      </div>

      <p id="login-erro" class="mensagem-erro" role="alert" hidden></p>

      <div class="acoes-filtros">
        <button type="submit" class="botao botao-primario">Entrar</button>
      </div>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
