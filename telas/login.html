<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Catálogo de Produtos</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="entrada-sistema">
    <div class="entrada-arte">
      <div>
        <p class="rotulo-destaque">Catálogo de Produtos</p>
        <h1>Controle de estoque para a sua ótica</h1>
        <p>Cadastre produtos, registre saídas e acompanhe tudo em um só lugar.</p>
      </div>
      <p class="apagado">Projeto Integrador II</p>
    </div>

    <div class="entrada-forma">
      <h2>Entrar</h2>
      <p class="apagado">Use o e-mail e a senha cadastrados no sistema.</p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" class="entrada" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" class="entrada" autocomplete="current-password" required>
        </div>

        <p id="login-erro" class="erro-geral" role="alert" hidden></p>

        <button type="submit" class="botao botao-principal">Entrar</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
