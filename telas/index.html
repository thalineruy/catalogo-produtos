<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Catálogo de Produtos</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="entrada-sistema">
    <div class="entrada-arte">
      <div>
        <h1>Catálogo de Produtos</h1>
        <p class="apagado">Consulta de produtos com imagem, controle de quantidade e registro de saída.</p>
      </div>
      <p class="apagado">Projeto Integrador II</p>
    </div>

    <div class="entrada-forma">
      <h2>Acessar o sistema</h2>
      <p class="apagado">Use as credenciais fornecidas pelo administrador.</p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-email">E-mail corporativo</label>
          <input type="email" id="login-email" name="email" class="entrada" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" class="entrada" autocomplete="current-password" required>
        </div>

        <p id="login-erro" class="erro-geral" role="alert" hidden></p>

        <button type="submit" class="botao botao-principal">Continuar <span aria-hidden="true">→</span></button>
      </form>

      <div class="rodape-entrada">
        <button type="button" id="botao-esqueci-senha" class="botao botao-texto">Esqueci minha senha</button>
        <span class="apagado">Versão 1.0</span>
      </div>
    </div>
  </div>

  <div class="aviso" id="toast-aviso" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
